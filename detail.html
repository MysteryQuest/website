<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Event Record — The Unverified File</title>
    <meta name="description" content="A sourced event record from The Unverified File public archive." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{'matrix-green':'#43e08f','terminal-green':'#0a9461','cyber-red':'#ff6b7f','charcoal':'#101613','dark-charcoal':'#090c0b','cyber-yellow':'#f1c75b'},fontFamily:{orbitron:['Orbitron','monospace']}}}};</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Orbitron:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="evidence-platform.css" />
    <link rel="stylesheet" href="community.css" />
    <style>
      .event-map-frame{position:relative;overflow:hidden;border:1px solid rgba(67,224,143,.3);border-radius:var(--radius);background:#0b100d;box-shadow:var(--shadow)}
      #event-map{height:clamp(28rem,62vh,43rem);min-height:28rem}
      .event-map-label{position:absolute;z-index:500;top:1rem;left:1rem;max-width:min(30rem,calc(100% - 2rem));padding:.75rem 1rem;border:1px solid rgba(67,224,143,.28);border-radius:.55rem;background:rgba(9,12,11,.9);backdrop-filter:blur(8px);pointer-events:none}
      .event-map-label strong{display:block;font-family:"Source Serif 4",serif;font-size:1.15rem}
      .event-map-label span{color:var(--muted);font:.72rem "JetBrains Mono",monospace}
      .event-facts{display:grid;gap:.85rem;margin-top:1rem}
      .event-fact{padding-top:.8rem;border-top:1px solid var(--line)}
      .event-fact span{display:block;color:var(--faint);font:.68rem "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
      .event-fact strong{display:block;margin-top:.15rem;color:var(--ink);font-weight:600}
      .event-media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
      .event-video{overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
      .event-video iframe,.event-video img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#050706}
      .event-video div{padding:1rem}.event-video h3{margin:0 0 .65rem;font-family:"Source Serif 4",serif;font-size:1.2rem}
      .event-source-actions{display:flex;flex-wrap:wrap;gap:.75rem}
      .event-image{width:100%;max-height:32rem;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line)}
      .leaflet-container{font-family:Inter,system-ui,sans-serif;background:#0b100d}.leaflet-control-attribution{background:rgba(9,12,11,.82)!important;color:#aeb9b3}.leaflet-control-attribution a{color:#43e08f!important}
      @media(max-width:820px){.event-media-grid{grid-template-columns:1fr}#event-map{height:32rem;min-height:32rem}.event-map-label{top:.65rem;left:.65rem;max-width:calc(100% - 1.3rem)}}
    </style>
  </head>
  <body class="evidence-page pb-16 xl:pb-0">
    <a class="skip-link" href="#event-main">Skip to event record</a>
    <div id="header-container"></div>
    <main id="event-main">
      <header class="page-hero"><div class="shell" id="event-header"><p class="empty">Loading event record…</p></div></header>
      <div id="event-content"></div>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="js/header.js?v=20260725-event1"></script>
    <script src="js/footer.js?v=20260725-event1"></script>
    <script src="js/navigation.js"></script>
    <script src="js/data-api.js?v=20260725-event1"></script>
    <script src="js/community.js?v=20260725-event1"></script>
    <script>
      const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
      const safeUrl=value=>{try{const url=new URL(value,location.origin);return ["http:","https:"].includes(url.protocol)?url.href:""}catch{return""}};
      const parseJson=(value,fallback={})=>{if(!value)return fallback;if(typeof value==="object")return value;try{return JSON.parse(value)}catch{return fallback}};
      const videoId=value=>{const match=String(value||"").match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([^&?#/]+)/);return match?match[1]:""};
      const hasCoordinates=event=>Number.isFinite(Number(event.latitude))&&Number.isFinite(Number(event.longitude))&&Number(event.latitude)>=-90&&Number(event.latitude)<=90&&Number(event.longitude)>=-180&&Number(event.longitude)<=180;
      const fact=(label,value)=>value!==null&&value!==undefined&&String(value).trim()!==""?`<div class="event-fact"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`:"";

      function renderVideos(videos){
        if(!videos.length)return"";
        return `<section class="section" id="media"><div class="shell"><p class="eyebrow">Related media</p><h2 class="section-title">Video records</h2><p class="notice reading">Related videos are leads and context. Their presence does not independently verify this event.</p><div class="event-media-grid" style="margin-top:1.5rem">${videos.map(video=>{const url=safeUrl(video.url);const id=videoId(url);const thumb=safeUrl(video.thumbnail);return `<article class="event-video">${id?`<iframe src="https://www.youtube-nocookie.com/embed/${esc(id)}?rel=0" title="${esc(video.title||"Related video")}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`:thumb?`<img src="${esc(thumb)}" alt="${esc(video.title||"")}" loading="lazy">`:""}<div><h3>${esc(video.title||"Related video")}</h3>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open original video ↗</a>`:""}</div></article>`}).join("")}</div></div></section>`;
      }

      function renderEvent(event){
        const id=event.d1_id||event.id;
        const coordinates=hasCoordinates(event);
        const source=safeUrl(event.url);
        const research=safeUrl(event.research_link);
        const image=safeUrl(event.image_url);
        const analysis=parseJson(event.ai_analysis,{});
        const videoData=parseJson(event.youtube_videos,{});
        const videos=Array.isArray(videoData)?videoData:Array.isArray(videoData.videos)?videoData.videos:[];
        const score=Number(event.credibility_score);
        const sourceCount=Number(analysis.external_sources||analysis.total_sources||0);
        const nav=[coordinates?'<a href="#map">Map</a>':"",'<a href="#record">Record</a>',videos.length?'<a href="#media">Media</a>':"",'<a href="#sources">Sources</a>','<a href="#community-review">Community review</a>'].filter(Boolean).join("");

        document.title=`${event.name} — The Unverified File`;
        document.querySelector('meta[name="description"]').content=String(event.description||"Public event record").slice(0,155);
        document.getElementById("event-header").innerHTML=`<p class="eyebrow">Archive event · ${esc(event.event_type||"Unclassified")}</p><h1 class="display">${esc(event.name)}</h1><p class="lede">${esc(event.description||"No public description is currently available for this record.")}</p><div class="meta"><span class="badge badge-published">public record</span>${event.date?`<span>${esc(event.date)}</span>`:""}${event.location?`<span>${esc(event.location)}</span>`:""}<span>${esc(event.investigation_status||"Open")} investigation</span></div><div class="actions"><a class="action" href="#community-review">Vote on this record</a>${coordinates?'<a class="action action-secondary" href="#map">Explore location</a>':""}<a class="action action-secondary" href="archive.html">Back to archive</a></div>`;

        const mapSection=coordinates?`<section class="section" id="map"><div class="shell"><p class="eyebrow">Mapped event</p><h2 class="section-title">Location record</h2><div class="event-map-frame"><div class="event-map-label"><strong>${esc(event.location||event.name)}</strong><span>${Number(event.latitude).toFixed(4)}, ${Number(event.longitude).toFixed(4)} · reported coordinates</span></div><div id="event-map" role="region" aria-label="Map showing ${esc(event.name)}"></div></div><p class="hero-caption">Coordinates indicate the location attached to the source record. Precision and attribution may require further review.</p></div></section>`:"";
        const imageMarkup=image?`<figure><img class="event-image" src="${esc(image)}" alt="Evidence media associated with ${esc(event.name)}" loading="lazy" referrerpolicy="no-referrer"><figcaption class="hero-caption">Associated media · ${event.image_status?esc(event.image_status.replaceAll("_"," ")):"provenance under review"}${safeUrl(event.image_source_url)?` · <a href="${esc(safeUrl(event.image_source_url))}" target="_blank" rel="noopener noreferrer">Image source ↗</a>`:""}</figcaption></figure>`:"";
        const analysisMarkup=Object.keys(analysis).length?`<div class="card" style="margin-top:1.5rem"><p class="eyebrow">Automated research context</p><h3>Pipeline assessment</h3><div class="event-facts">${fact("Credibility score",Number.isFinite(score)?`${score}/100`:"")}${fact("Sources detected",analysis.total_sources)}${fact("External sources",analysis.external_sources)}${fact("Last analyzed",analysis.last_updated)}</div><p class="notice" style="margin-top:1rem">Automated scores and source counts are research leads, not editorial findings.</p></div>`:"";
        const sourceItems=[source?{label:"Original source",url:source}:null,research?{label:"Research notes",url:research}:null].filter(Boolean);

        document.getElementById("event-content").innerHTML=`${mapSection}<section class="section" id="record"><div class="shell"><div class="case-layout"><article>${imageMarkup}<div class="card" style="margin-top:${imageMarkup?"1.5rem":"0"}"><p class="eyebrow">Current record</p><h2>What the archive says</h2><p class="lede">${esc(event.description||"No description has been published for this record.")}</p>${event.details?`<div class="prose"><p>${esc(event.details)}</p></div>`:""}</div>${analysisMarkup}</article><aside class="case-aside card" aria-label="Event record contents"><p class="eyebrow">On this page</p>${nav}<div class="event-facts">${fact("Classification",event.event_type||"Unclassified")}${fact("Date",event.date||"Not reported")}${fact("Location",event.location||"Not reported")}${fact("Status",event.investigation_status||"Open")}${fact("Verdict",event.verdict||event.real_or_hoax||"Unknown")}${fact("Credibility",Number.isFinite(score)?`${score}/100`:"Not scored")}${fact("Sources detected",sourceCount||"Not counted")}</div><div class="community-list-totals" data-community-totals data-target-type="event" data-target-id="${esc(id)}">Loading previous votes…</div><div class="community-quick-votes" data-community-vote-group data-target-type="event" data-target-id="${esc(id)}"><button type="button" data-community-vote="real">↑ Likely real</button><button type="button" data-community-vote="hoax">↓ Likely hoax</button><span data-community-vote-status role="status"></span></div></aside></div></div></section>${renderVideos(videos)}<section class="section" id="sources"><div class="shell"><p class="eyebrow">Source ledger</p><h2 class="section-title">Open the record</h2>${sourceItems.length?`<ol class="source-list">${sourceItems.map((item,index)=>`<li><span class="source-number">${String(index+1).padStart(2,"0")}</span><div><a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer"><strong>${esc(item.label)} ↗</strong></a><div class="meta"><span>External record</span><span>Verify provenance before reuse</span></div></div></li>`).join("")}</ol>`:'<p class="empty">No external source URL is attached to this imported record yet.</p>'}<div class="event-source-actions"><a class="action" href="network.html?id=${encodeURIComponent(id)}">View evidence graph</a><a class="action action-secondary" href="map.html">Open full evidence map</a></div></div></section><section class="section" id="community-review"><div class="shell"><div id="event-community"></div></div></section>`;

        if(coordinates){
          const map=L.map("event-map",{scrollWheelZoom:false}).setView([Number(event.latitude),Number(event.longitude)],10);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19}).addTo(map);
          L.marker([Number(event.latitude),Number(event.longitude)]).addTo(map).bindPopup(`<strong>${esc(event.name)}</strong><br>${esc(event.location||"")}`).openPopup();
          L.control.scale({imperial:true,metric:true}).addTo(map);
        }
        if(window.UnverifiedCommunity){
          UnverifiedCommunity.fillTotals(document);
          UnverifiedCommunity.wireVoteButtons(document);
          UnverifiedCommunity.mount({host:"#event-community",type:"event",id});
        }
      }

      async function loadEvent(){
        const params=new URLSearchParams(location.search);
        const eventId=params.get("id");
        const eventName=params.get("name");
        if(!eventId&&!eventName)throw new Error("No event was selected");
        const rows=await UnverifiedData.loadEvents();
        const event=eventId?rows.find(row=>String(row.d1_id)===String(eventId)):rows.find(row=>row.name&&eventName&&row.name.toLowerCase()===eventName.toLowerCase());
        if(!event)throw new Error("Event record not found");
        renderEvent(event);
      }
      loadEvent().catch(error=>{document.getElementById("event-header").innerHTML=`<p class="empty">${esc(error.message)}. <a href="archive.html">Browse the archive</a>.</p>`;document.getElementById("event-content").innerHTML=""});
    </script>
  </body>
</html>
