<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Case File — The Unverified File</title>
    <meta name="description" content="Evidence-first case file." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "matrix-green": "#43e08f",
              "terminal-green": "#0a9461",
              "cyber-red": "#ff6b7f",
              charcoal: "#101613",
              "dark-charcoal": "#090c0b",
              "cyber-yellow": "#f1c75b",
            },
            fontFamily: { orbitron: ["Orbitron", "monospace"] },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Orbitron:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="evidence-platform.css" />
    <link rel="stylesheet" href="community.css" />
  </head>
  <body class="evidence-page pb-16 xl:pb-0">
    <a class="skip-link" href="#case-main">Skip to case</a>
    <div id="header-container"></div>
    <main id="case-main">
      <div class="page-hero">
        <div class="shell">
          <div id="case-header"><p class="empty">Loading case file…</p></div>
        </div>
      </div>
      <div id="case-content"></div>
      <section class="section" id="community-review">
        <div class="shell"><div id="case-community"></div></div>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="js/header.js?v=20260723-evidence1"></script>
    <script src="js/footer.js?v=20260723-evidence1"></script>
    <script src="js/navigation.js"></script>
    <script src="js/community.js?v=20260724-community1"></script>
    <script>
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const safe = (v) => {
        try {
          const u = new URL(v, location.origin);
          return ["http:", "https:"].includes(u.protocol) ? u.href : "";
        } catch {
          return "";
        }
      };
      const rows = (
        items,
        fn,
        empty = "No records have been published in this section.",
      ) =>
        items.length ? items.map(fn).join("") : `<p class="empty">${empty}</p>`;
      function render(c) {
        document.title = `${c.title} — The Unverified File`;
        document.querySelector("meta[name=description]").content = c.dek;
        const demo = c.status === "demonstration";
        const showUapVisuals = c.topic === "UAP" && !demo;
        const visualNav = showUapVisuals
          ? '<a href="#visual-analysis">Map & node graph</a>'
          : "";
        const visualSection = showUapVisuals
          ? `<style>.uap-visual-shell{overflow:hidden;border:1px solid rgba(67,224,143,.24);border-radius:1rem;background:#090b0a}.uap-visual-frame{display:block;width:100%;height:1120px;border:0;background:#090b0a}.uap-visual-actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1rem}.uap-visual-actions a{font-weight:700}@media(max-width:1023px){.uap-visual-frame{height:1450px}}@media(max-width:640px){.uap-visual-frame{height:1320px}}</style><section class="section" id="visual-analysis"><div class="shell"><p class="eyebrow">Interactive evidence analysis</p><h2 class="section-title">Government reports, public sightings, and candidate connections</h2><p class="notice reading">Explore the geographic map, switch to the node graph, and inspect forecast zones. Every edge is a research candidate—not proof that two records describe the same object or cause.</p><div class="uap-visual-shell"><iframe class="uap-visual-frame" src="uap-alignments.html?embed=1&amp;case=${encodeURIComponent(c.slug)}" title="Interactive UAP report map and node graph" loading="lazy"></iframe></div><div class="uap-visual-actions"><a href="uap-alignments.html">Open the full UAP Alignment Explorer →</a><a href="uap-sightings.html">Open the public UAP sightings dataset →</a></div></div></section>`
          : "";
        document.getElementById("case-header").innerHTML =
          `${demo ? '<p class="notice reading">Demonstration record: this structure is public for review, but the underlying investigation is not complete and no finding is being published.</p>' : ""}<p class="eyebrow">Case file · ${esc(c.topic)}</p><h1 class="display">${esc(c.title)}</h1><p class="lede">${esc(c.dek)}</p><div class="meta"><span class="badge badge-${esc(c.status)}">${esc(c.status)}</span><span>Updated ${esc(c.updated_at)}</span><span>${c.claims.length} claims</span><span>${c.evidence.length} evidence records</span><span>${c.sources.length} sources</span></div>`;
        const hero =
          c.hero && safe(c.hero.src)
            ? `<figure><img class="hero-media" src="${esc(safe(c.hero.src))}" alt="${esc(c.hero.alt || "")}" loading="eager"><figcaption class="hero-caption">${esc(c.hero.credit || "")} · <a href="${esc(safe(c.hero.source_url))}" rel="noopener noreferrer">Source</a></figcaption></figure>`
            : "";
        document.getElementById("case-content").innerHTML =
          `<section class="section"><div class="shell">${hero}<div class="case-layout" style="margin-top:${hero ? "2rem" : "0"}"><article><div class="card"><p class="eyebrow">Current assessment</p><p class="lede">${esc(c.summary)}</p></div><div class="prose" id="report">${c.narrative_html}</div></article><aside class="case-aside card" aria-label="Case file contents"><p class="eyebrow">On this page</p>${visualNav}<a href="#claims">Claims</a><a href="#evidence">Evidence</a><a href="#hypotheses">Hypotheses</a><a href="#connections">Connections</a><a href="#timeline">Timeline</a><a href="#sources">Sources</a><a href="#revisions">Revisions & AI</a></aside></div></div></section>${visualSection}<section class="section" id="claims"><div class="shell"><p class="eyebrow">Claim ledger</p><h2 class="section-title">What is being assessed</h2>${rows(c.claims, (x) => `<article class="evidence-row"><span class="badge badge-${esc(x.state)}">${esc(x.state)}</span><h3>${esc(x.text)}</h3><p>${x.evidence_ids.length} linked evidence record${x.evidence_ids.length === 1 ? "" : "s"}</p></article>`)}</div></section><section class="section" id="evidence"><div class="shell"><p class="eyebrow">Evidence record</p><h2 class="section-title">What the sources support</h2>${rows(c.evidence, (x) => `<article class="evidence-row"><div class="meta"><span>${esc(x.type)}</span><span>${x.source_ids.length} source${x.source_ids.length === 1 ? "" : "s"}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><p><strong>Limitation:</strong> ${esc(x.limitations)}</p></article>`)}</div></section><section class="section" id="hypotheses"><div class="shell"><p class="eyebrow">Competing explanations</p><h2 class="section-title">Hypotheses under review</h2>${rows(c.hypotheses, (x) => `<article class="evidence-row"><span class="badge">${esc(x.status)}</span><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><p><strong>What would change this:</strong> ${esc(x.would_change)}</p></article>`)}</div></section><section class="section" id="connections"><div class="shell"><p class="eyebrow">Related records</p><h2 class="section-title">Preliminary connections</h2><p class="notice reading">A connection identifies a shared incident, entity, place, time, or dataset. It is not proof of a shared cause.</p>${rows(c.connections, (x) => `<article class="evidence-row"><span class="badge">${esc(x.strength)}</span><h3><a href="${esc(x.href)}">${esc(x.title)}</a></h3><p>${esc(x.description)}</p></article>`)}</div></section><section class="section" id="timeline"><div class="shell"><p class="eyebrow">Chronology</p><h2 class="section-title">Timeline</h2>${rows(c.timeline, (x) => `<article class="evidence-row"><div class="meta"><time>${esc(x.date)}</time></div><h3>${esc(x.label)}</h3><p>${esc(x.description)}</p></article>`)}</div></section><section class="section" id="sources"><div class="shell"><p class="eyebrow">Source ledger</p><h2 class="section-title">Open the record</h2><ol class="source-list">${rows(c.sources, (x, i) => `<li><span class="source-number">${String(i + 1).padStart(2, "0")}</span><div><a href="${esc(safe(x.url))}" target="_blank" rel="noopener noreferrer"><strong>${esc(x.title)} ↗</strong></a><div class="meta"><span>${esc(x.publisher)}</span><span>${esc(x.kind)}</span><span>Accessed ${esc(x.accessed_at)}</span></div></div></li>`)}</ol></div></section><section class="section" id="revisions"><div class="shell grid grid-2"><div><p class="eyebrow">Revision record</p><h2 class="section-title">What changed</h2>${rows(c.revisions, (x) => `<article class="evidence-row"><div class="meta"><time>${esc(x.date)}</time><span>${esc(x.editor)}</span></div><p>${esc(x.summary)}</p></article>`)}</div><div><p class="eyebrow">AI disclosure</p><h2 class="section-title">How automation assisted</h2><div class="card"><p>${esc(c.ai_disclosure)}</p><p class="meta">Human reviewed: ${c.review.human_reviewed ? "yes" : "no"}${c.review.reviewer ? ` · ${esc(c.review.reviewer)}` : ""}</p></div></div></div></section>`;
        UnverifiedCommunity.mount({
          host: "#case-community",
          type: "case",
          id: c.id,
        });
      }
      const slug = new URLSearchParams(location.search).get("slug");
      if (!slug) {
        document.getElementById("case-header").innerHTML =
          '<p class="empty">No case was selected. <a href="case-files.html">Browse case files</a>.</p>';
      } else
        fetch("api/cases.json?v=20260723-evidence1")
          .then((r) => r.json())
          .then((d) => {
            const c = d.find(
              (x) => x.slug === slug && x.status !== "demonstration",
            );
            if (!c) throw Error("Case file not found");
            render(c);
          })
          .catch(
            (e) =>
              (document.getElementById("case-header").innerHTML =
                `<p class="empty">${esc(e.message)}. <a href="case-files.html">Browse case files</a>.</p>`),
          );
    </script>
  </body>
</html>
