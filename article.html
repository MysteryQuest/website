<head>
    <meta charset="UTF-8">

    <meta property="twitter:title" content="D-LOG Article">

    <meta property="twitter:image" content="https://unverifiedfile.com/logo.png">

    <link rel="canonical" href="https://unverifiedfile.com/article.html" />

        tailwind.config = {
            theme: {

                        'matrix-green': '#00cc66',
                        'terminal-green': '#0a9461',

                    },

                    }

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <link href="styles.css" rel="stylesheet">
    
    <!-- Analytics -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1028115466622942" crossorigin="anonymous"></script>

    <script>

</head>

<body class="text-gray-100">
    
    <!-- Navigation (loaded dynamically) -->
    <div id="header-container"></div>

    <!-- Hero Section -->
    <section class="relative min-h-[40vh] flex items-center justify-center overflow-hidden">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
            <img src="splash.webp" alt="The Unverified File" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-b from-charcoal/20 via-dark-charcoal/30 to-charcoal/40"></div>
        </div>
        
        <!-- Hero Content -->
        <div class="relative z-10 container mx-auto px-4 py-20 text-center">
            <div id="article-header">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Article Content -->
    <section class="bg-charcoal/80 py-16">
        <div class="container mx-auto px-4 max-w-4xl">
            <article id="article-content" class="prose prose-invert prose-lg max-w-none">
                <!-- Loaded dynamically -->
            </article>
        </div>
    </section>

    <!-- Footer (loaded dynamically) -->
    <div id="footer-container"></div>

    <!-- Header & Footer Includes -->
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/cache-buster.js"></script>

    <!-- Article Loading Script -->
    <script>
        function showNotFound() {
            document.getElementById('article-header').innerHTML = `
                <div class="terminal-box rounded-2xl p-8 max-w-3xl mx-auto">
                    <h1 class="text-4xl md:text-5xl font-orbitron font-bold text-cyber-red mb-4">
                        <i class="fas fa-exclamation-triangle"></i> Article Not Found
                    </h1>
                    <p class="text-xl text-gray-300 mb-6">The requested D-LOG report could not be found.</p>
                    <a href="blog.html" class="inline-block px-8 py-3 bg-matrix-green hover:bg-terminal-green text-charcoal font-semibold rounded-lg transition-colors">
                        <i class="fas fa-arrow-left"></i> Back to D-LOG Archive
                    </a>
                </div>
            `;
        }

        function renderArticle(article) {
            document.title = `${article.title} - The Unverified File`;
            document.querySelector('meta[name="description"]').setAttribute('content', article.title);
            document.querySelector('meta[property="og:title"]').setAttribute('content', article.title);
            document.querySelector('meta[property="twitter:title"]').setAttribute('content', article.title);

            document.getElementById('article-header').innerHTML = `
                <div class="terminal-box rounded-2xl p-8 md:p-12 max-w-3xl mx-auto">
                    <div class="mb-4">
                        <span class="inline-block px-4 py-2 bg-matrix-green/20 border border-matrix-green text-matrix-green rounded-full text-sm font-semibold mb-4">
                            ${article.category}
                        </span>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-orbitron font-bold text-matrix-green mb-6">
                        ${article.title}
                    </h1>
                    <div class="flex flex-wrap items-center gap-6 text-gray-400 text-sm">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-calendar"></i>
                            <span>${new Date(article.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-user-robot"></i>
                            <span>${article.author}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-clock"></i>
                            <span>${article.readTime}</span>
                        </div>
                    </div>
                </div>
            `;

            // Render body — convert plain text sections to HTML if needed
            let bodyHtml = article.body || article.content || '';
            // If it looks like plain text (no HTML tags), wrap paragraphs
            if (bodyHtml && !bodyHtml.includes('<')) {
                bodyHtml = bodyHtml.split('\n\n').map(p => `<p>${p.trim()}</p>`).join('\n');
            }

            document.getElementById('article-content').innerHTML = `
                <div class="bg-dark-charcoal/60 rounded-lg p-8 md:p-12">
                    ${bodyHtml}
                    ${article.source_urls && article.source_urls.length ? `
                    <hr class="border-matrix-green/30 my-8">
                    <div class="mb-6">
                        <h3 class="text-sm font-mono text-matrix-green mb-3">SOURCE ARTICLES</h3>
                        <ul class="space-y-1">
                            ${article.source_urls.map(u => `<li><a href="${u}" target="_blank" rel="noopener noreferrer" class="text-xs text-gray-400 hover:text-matrix-green break-all">${u}</a></li>`).join('')}
                        </ul>
                    </div>` : ''}
                    <hr class="border-matrix-green/30 my-8">
                    <div class="flex justify-between items-center">
                        <a href="blog.html" class="inline-block px-6 py-3 bg-charcoal border-2 border-matrix-green text-matrix-green hover:bg-matrix-green hover:text-charcoal font-semibold rounded-lg transition-colors">
                            <i class="fas fa-arrow-left"></i> Back to D-LOG
                        </a>
                        <div class="flex gap-4">
                            <a href="#" onclick="window.print(); return false;" class="text-gray-400 hover:text-matrix-green transition-colors">
                                <i class="fas fa-print"></i> Print
                            </a>
                            <a href="#" onclick="navigator.share&&navigator.share({title: document.title, url: window.location.href}); return false;" class="text-gray-400 hover:text-matrix-green transition-colors">
                                <i class="fas fa-share-alt"></i> Share
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadArticle() {
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) { showNotFound(); return; }
            try {
                const articles = await fetch('./api/articles.json').then(r => {
                    if (!r.ok) throw new Error('not found');
                    return r.json();
                });
                const article = articles.find(a => a.slug === slug);
                if (article) { renderArticle(article); return; }
            } catch(e) { /* fall through to not-found */ }
            showNotFound();
        }

        document.addEventListener('DOMContentLoaded', loadArticle);
    </script>

</body>
</html>
