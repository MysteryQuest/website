n><div id="footer-container"></div><script src="js/header.js?v=20260723-evidence1"></script><script src="js/footer.js?v=20260723-evidence1"></script><script src="js/navigation.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let records=[];const render=f=>{const view=f==='all'?records:records.filter(c=>c.status===f);document.getElementById('cases').innerHTML=view.map(c=>`<a class="card" href="${esc(c.url)}"><div class="meta"><span class="badge badge-${esc(c.status)}">${esc(c.status)}</span><span>${esc(c.topic)}</span></div><h2>${esc(c.title)}</h2><p>${esc(c.dek)}</p><div class="meta"><span>Updated ${esc(c.updated_at)}</span><span>${c.claims.length} claims</span><span>${c.sources.length} sources</span></div></a>`).join('')||'<p class="empty">No cases match this filter.</p>'};fetch('api/cases.json?v=20260723-evidence1').then(r=>r.json()).then(d=>{records=d;render('all')}).catch(()=>document.getElementById('cases').innerHTML='<p class="empty">Case index is temporarily unavailable.</p>');document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.className='action action-secondary filter');b.className='action filter';render(b.dataset.filter)}));
</script></body></html>
